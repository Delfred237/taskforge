name: TaskForge CI/CD

# Déclencheurs du workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions nécessaires pour pousser l'image vers GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-test-docker:
    name: Build, Test & Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurer Java 21 avec cache Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compiler et exécuter tous les tests
      - name: Build and Test with Maven
        run: mvn clean verify --batch-mode --fail-at-end

      # 4. Builder l'image Docker
      - name: Build Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_NAME="taskforge"
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest
          echo "Image built: ${IMAGE_NAME}:${IMAGE_TAG}"

      # 5. (Optionnel) Vérifier que le container démarre
      - name: Smoke test Docker container
        run: |
          CONTAINER_ID=$(docker run -d -p 8081:8080 taskforge:${{ github.sha }})
          echo "Container started: $CONTAINER_ID"
          
          # Attendre que le serveur soit prêt
          for i in {1..30}; do
            if nc -z localhost 8081; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          
          # Vérifier que le serveur répond
          RESPONSE=$(echo '{"requestId":"smoke-test", "action":"SERVER_STATUS", "payload":""}' | nc localhost 8081 || echo "FAILED")
          echo "Server response: $RESPONSE"
          
          if [[ "$RESPONSE" == "FAILED" ]]; then
            echo "Smoke test failed!"
            docker logs $CONTAINER_ID
            exit 1
          fi
          
          # Arrêter le container
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID

      # 6. (Optionnel) Pousser l'image vers GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.sha }}"

          docker tag taskforge:${IMAGE_TAG} ghcr.io/${OWNER_LOWER}/taskforge:${IMAGE_TAG}
          docker push ghcr.io/${OWNER_LOWER}/taskforge:${IMAGE_TAG}

          # Push aussi le tag 'latest' si on est sur la branche main
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag taskforge:latest ghcr.io/${OWNER_LOWER}/taskforge:latest
            docker push ghcr.io/${OWNER_LOWER}/taskforge:latest
          fi